{% extends 'base.html' %}

{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">Talabalar / O'chirish</p>
    <h1>O'quvchini o'chirish</h1>
  </div>
</div>

<form class="form-sheet" method="post">
  {% csrf_token %}
  <p>Haqiqatan ham <strong>{{ object.first_name }} {{ object.last_name }}</strong> o'quvchisini o'chirmoqchimisiz?</p>
  <div class="form-actions">
    <button type="submit" class="btn danger">Ha, O'chirish</button>
    <a href="{% url 'student_list' %}" class="btn secondary">Bekor qilish</a>
  </div>
</form>
{% endblock %}
