{% extends 'base.html' %}

{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">Talabalar / Forma</p>
    <h1>O'quvchi ma'lumotlari</h1>
  </div>
</div>

<form class="form-sheet" method="post">
  {% csrf_token %}
  <div class="field">
    <label for="id_first_name">Ismi</label>
    {{ form.first_name }}
  </div>
  <div class="field">
    <label for="id_last_name">Familiyasi</label>
    {{ form.last_name }}
  </div>
  <div class="field">
    <label for="id_phone">Telefon raqami</label>
    {{ form.phone }}
  </div>

  <div class="form-actions">
    <button type="submit" class="btn">Saqlash</button>
    <a href="{% url 'student_list' %}" class="btn secondary">Bekor qilish</a>
  </div>
</form>
{% endblock %}
