<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan O'tish — Smart Maktab</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 450px;
            max-width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 14px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-size: 22px; font-weight: 800;">Ro'yxatdan O'tish</h2>
            <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;">Smart Maktab tizimida yangi hisob yaratish</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">USERNAME:</label>
                {{ form.username }}
            </div>
            <div style="display: flex; gap: 12px;">
                <div style="flex: 1;">
                    <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">ISMI:</label>
                    {{ form.first_name }}
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">FAMILIYASI:</label>
                    {{ form.last_name }}
                </div>
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">EMAIL:</label>
                {{ form.email }}
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">PAROL:</label>
                {{ form.password }}
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">PAROLNI TASDIQLANG:</label>
                {{ form.password2 }}
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 10px;">Ro'yxatdan O'tish</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8;">
            Akkountingiz bormi? <a href="{% url 'login' %}" style="color: #06b6d4; text-decoration: none; font-weight: 700;">Kirish</a>
        </div>
    </div>
</body>
</html>
