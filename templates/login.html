<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga Kirish — Smart Maktab</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 400px;
            max-width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            margin-top: 6px;
            margin-bottom: 18px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #6366f1, #06b6d4); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px;">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 style="font-size: 24px; font-weight: 800;">Smart Maktab</h2>
            <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;">Tizimga kirish uchun malumotlaringizni kiriting</p>
        </div>

        {% if error %}
        <div style="background: rgba(244, 63, 94, 0.2); color: #f87171; border: 1px solid rgba(244,63,94,0.3); padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; text-align: center;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">USERNAME / LOG IN:</label>
                <input type="text" name="username" class="form-control" placeholder="admin yoki teacher1" required>
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #94a3b8;">PAROL:</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Kirish</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8;">
            Akkountingiz yo'qmi? <a href="{% url 'register' %}" style="color: #06b6d4; text-decoration: none; font-weight: 700;">Ro'yxatdan o'tish</a>
        </div>
    </div>
</body>
</html>
